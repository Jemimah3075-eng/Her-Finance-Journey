<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Her Finance Journey logo option A</title>
  <desc id="desc">A refined editorial wordmark with a subtle upward movement built into Journey.</desc>
  <defs>
    <linearGradient id="paperA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="0.58" stop-color="#fff6f3"/>
      <stop offset="1" stop-color="#f3e4dd"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8c5f5d"/>
      <stop offset="0.52" stop-color="#c99a8c"/>
      <stop offset="1" stop-color="#e5c9bb"/>
    </linearGradient>
    <filter id="softShadowA" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#73504f" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="1152" height="372" rx="42" fill="url(#paperA)"/>
  <path d="M112 317 C266 263, 392 302, 526 238 C650 179, 745 122, 884 146 C990 164, 1036 116, 1088 76"
        fill="none" stroke="#dbc2b8" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <path d="M126 103 H270" stroke="#caa89d" stroke-width="1.7" stroke-linecap="round" opacity="0.85"/>
  <path d="M892 316 H1076" stroke="#caa89d" stroke-width="1.7" stroke-linecap="round" opacity="0.85"/>
  <g filter="url(#softShadowA)">
    <text x="148" y="142"
          font-family="Optima, Avenir Next, Helvetica, sans-serif"
          font-size="34" font-weight="500" letter-spacing="12" fill="#6b5b5c">HER FINANCE</text>
    <text x="142" y="254"
          font-family="Didot, Bodoni 72, Georgia, serif"
          font-size="112" font-weight="400" letter-spacing="-1.4" fill="#2d2729">Journey</text>
  </g>
  <path d="M462 252 C500 229, 526 190, 536 136 C545 83, 569 56, 608 46"
        fill="none" stroke="url(#accentA)" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M594 43 C601 43, 607 44, 614 47 C610 52, 606 58, 603 65"
        fill="none" stroke="url(#accentA)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="313"
        font-family="Optima, Avenir Next, Helvetica, sans-serif"
        font-size="15" font-weight="600" letter-spacing="6.5" fill="#8f7670">CONFIDENCE  /  COMMUNITY  /  GROWTH</text>
</svg>
